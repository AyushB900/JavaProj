services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banksync
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/banksync
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BANKSYNC_API_USER: ${BANKSYNC_API_USER:?Set BANKSYNC_API_USER in .env}
      BANKSYNC_API_PASSWORD: ${BANKSYNC_API_PASSWORD:?Set BANKSYNC_API_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  postgres_data:
networks:
  database:
    internal: true
  edge:
